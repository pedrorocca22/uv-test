<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0c">
    <title>UV Pro 365</title>
    <style>
        :root { 
            --bg: #0a0a0c; --card: #1c1c1f; --prim: #6200ea; 
            --acc: #00e676; --err: #ff1744; --txt: #ffffff; 
            --sec: #b0b0b0;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); color: var(--txt); margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* --- HEADER & STATUS --- */
        header {
            width: 100%; padding: 15px 20px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10,10,12,0.9); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .brand { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.5px; }
        .status-badge { 
            font-size: 0.7rem; font-weight: bold; 
            padding: 4px 10px; border-radius: 20px; 
            background: #222; color: #666; transition: 0.3s;
        }
        .status-badge.on { background: rgba(0, 230, 118, 0.2); color: var(--acc); }

        /* --- MAIN CARD --- */
        .container { width: 90%; max-width: 400px; padding-bottom: 100px; }
        
        .hero-card {
            margin-top: 20px; background: var(--card); border-radius: 30px;
            padding: 40px 20px; text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative; overflow: hidden;
        }
        
        /* Efecto de brillo si hay UV */
        .uv-active-glow {
            position: absolute; top: 0; left: 0; width: 100%; height: 5px;
            background: var(--prim); box-shadow: 0 0 20px var(--prim);
            opacity: 0; transition: opacity 0.5s;
        }

        .val-big { font-size: 4.8rem; font-weight: 800; margin: 5px 0; line-height: 1; letter-spacing: -2px; }
        .unit { font-size: 1rem; color: var(--sec); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        .label { font-size: 0.8rem; color: var(--sec); text-transform: uppercase; margin-top: 10px; display: block; }

        /* --- TARGET INPUT --- */
        .target-box {
            margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column; align-items: center;
        }
        .input-row {
            display: flex; align-items: center; gap: 10px; margin-top: 10px;
            background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        input {
            background: transparent; border: none; color: var(--acc);
            font-size: 1.4rem; width: 80px; text-align: center; font-weight: bold;
            outline: none; font-family: monospace;
        }
        
        /* --- PROGRESS BAR --- */
        .progress-container {
            width: 100%; height: 6px; background: #333; margin-top: 0;
            position: fixed; top: 0; left: 0; z-index: 101; display: none;
        }
        .progress-fill { height: 100%; background: var(--acc); width: 0%; transition: width 0.2s linear; }

        /* --- STATS GRID --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-item { 
            background: var(--card); padding: 20px; border-radius: 20px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.03);
        }
        .val-med { font-size: 1.8rem; font-weight: 700; color: var(--txt); }
        .lbl-sm { font-size: 0.75rem; color: var(--sec); text-transform: uppercase; margin-bottom: 5px; display: block;}

        /* --- ACTION BUTTON --- */
        .fab-container { position: fixed; bottom: 30px; right: 30px; z-index: 200; }
        .btn-fab {
            width: 70px; height: 70px; border-radius: 50%; border: none;
            background: var(--prim); color: white;
            box-shadow: 0 10px 25px rgba(98, 0, 234, 0.4);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s, background 0.3s;
        }
        .btn-fab:active { transform: scale(0.92); }
        .btn-fab svg { width: 32px; height: 32px; fill: currentColor; }
        
        /* Estados del botón */
        .btn-fab.recording { background: var(--err); box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.7); animation: pulse 1.5s infinite; }
        .btn-fab.connect-mode { background: #333; box-shadow: none; border: 1px solid #555; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 23, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0); }
        }

        /* --- HISTORY --- */
        .history { width: 100%; margin-top: 30px; }
        .h-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--sec); margin-bottom: 10px; padding: 0 5px; }
        .h-list { display: flex; flex-direction: column; gap: 8px; }
        .h-item { 
            background: rgba(255,255,255,0.05); padding: 12px 15px; border-radius: 12px; 
            display: flex; justify-content: space-between; font-size: 0.9rem;
        }
        .h-tag { background: rgba(0,230,118,0.15); color: var(--acc); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; margin-left: 5px; }

    </style>
</head>
<body>

    <div id="progBar" class="progress-container"><div id="progFill" class="progress-fill"></div></div>

    <header>
        <div class="brand">UV Pro 365</div>
        <div id="statusBadge" class="status-badge">DESCONECTADO</div>
    </header>

    <div class="container">
        <div class="hero-card">
            <div id="glow" class="uv-active-glow"></div>
            <span class="label">Irradiancia Instantánea</span>
            <div id="irr" class="val-big">0.00</div>
            <div class="unit">mW / cm²</div>

            <div class="target-box">
                <span class="label">Dosis Objetivo</span>
                <div class="input-row">
                    <input type="number" id="targetInput" placeholder="0" value="0">
                    <span style="color:var(--sec)">mJ</span>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="stat-item">
                <span class="lbl-sm">Dosis Acumulada</span>
                <div id="dose" class="val-med" style="color:var(--acc)">0.00</div>
                <span class="lbl-sm" style="margin-top:0">mJ/cm²</span>
            </div>
            <div class="stat-item">
                <span class="lbl-sm">Pico Máx</span>
                <div id="peak" class="val-med">0.0</div>
                <span class="lbl-sm" style="margin-top:0">mW/cm²</span>
            </div>
        </div>

        <div class="history">
            <div class="h-header">
                <span>HISTORIAL RECIENTE</span>
                <span onclick="clearHist()" style="text-decoration:underline; cursor:pointer">Borrar</span>
            </div>
            <div id="histList" class="h-list">
                </div>
        </div>
    </div>

    <div class="fab-container">
        <button id="mainBtn" class="btn-fab connect-mode" onclick="handleMainAction()">
            <svg id="iconBle" viewBox="0 0 24 24"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg>
            <svg id="iconPlay" viewBox="0 0 24 24" style="display:none"><path d="M8 5v14l11-7z"/></svg>
            <svg id="iconStop" viewBox="0 0 24 24" style="display:none"><path d="M6 6h12v12H6z"/></svg>
        </button>
    </div>

    <script>
        // CONFIGURACIÓN BLE (Coincide con ESP32)
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        // ESTADO
        let state = {
            connected: false,
            recording: false,
            dose: 0,
            peak: 0,
            lastT: 0,
            target: 0,
            history: JSON.parse(localStorage.getItem('uvpro_logs') || '[]')
        };

        // ELEMENTOS DOM
        const ui = {
            irr: document.getElementById('irr'),
            dose: document.getElementById('dose'),
            peak: document.getElementById('peak'),
            badge: document.getElementById('statusBadge'),
            btn: document.getElementById('mainBtn'),
            glow: document.getElementById('glow'),
            targetInp: document.getElementById('targetInput'),
            pBar: document.getElementById('progBar'),
            pFill: document.getElementById('progFill'),
            hist: document.getElementById('histList'),
            icons: {
                ble: document.getElementById('iconBle'),
                play: document.getElementById('iconPlay'),
                stop: document.getElementById('iconStop')
            }
        };

        // --- GESTIÓN BLE ---
        let bleChar = null;

        async function connect() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true, // Modo más compatible
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleChar = await service.getCharacteristic(CHAR_UUID);

                // Iniciar notificaciones
                await bleChar.startNotifications();
                bleChar.addEventListener('characteristicvaluechanged', handleData);

                // UI Update
                state.connected = true;
                ui.badge.innerText = "CONECTADO";
                ui.badge.classList.add('on');
                updateBtnState(); // Cambia icono a Play
                
                device.addEventListener('gattserverdisconnected', () => {
                    state.connected = false;
                    ui.badge.innerText = "DESCONECTADO";
                    ui.badge.classList.remove('on');
                    if(state.recording) stopSession();
                    updateBtnState();
                    alert("Conexión perdida");
                });

            } catch (e) {
                console.error(e);
                alert("Error conectando: " + e);
            }
        }

        // --- PROCESAMIENTO DE DATOS ---
        function handleData(event) {
            const dec = new TextDecoder();
            const raw = dec.decode(event.target.value); // Formato: "12.34|25.0"
            const parts = raw.split('|');
            
            const irr = parseFloat(parts[0]);
            // const temp = parseFloat(parts[1]); // Temperatura disponible si se quiere usar

            // Actualizar Pantalla
            ui.irr.innerText = irr.toFixed(2);
            ui.glow.style.opacity = irr > 1 ? 1 : 0; // Brillo si hay UV

            // Lógica de Grabación / Dosis
            if (state.recording) {
                const now = Date.now();
                if (state.lastT > 0 && irr > 0) {
                    const dt = (now - state.lastT) / 1000.0;
                    state.dose += irr * dt;
                    if (irr > state.peak) state.peak = irr;
                    
                    ui.dose.innerText = state.dose.toFixed(1);
                    ui.peak.innerText = state.peak.toFixed(2);

                    // Chequeo de Objetivo
                    if (state.target > 0) {
                        const pct = Math.min((state.dose / state.target) * 100, 100);
                        ui.pFill.style.width = pct + "%";
                        
                        if (state.dose >= state.target) {
                            stopSession(true); // Terminar por objetivo
                        }
                    }
                }
                state.lastT = now;
            }
        }

        // --- CONTROL DE SESIÓN ---
        function handleMainAction() {
            if (!state.connected) {
                connect();
            } else {
                toggleRecording();
            }
        }

        function toggleRecording() {
            if (state.recording) {
                stopSession();
            } else {
                startSession();
            }
        }

        function startSession() {
            // Leer objetivo
            const t = parseFloat(ui.targetInp.value);
            state.target = isNaN(t) ? 0 : t;
            
            // Reset valores
            state.dose = 0;
            state.peak = 0;
            state.lastT = Date.now();
            state.recording = true;

            // UI
            ui.btn.classList.add('recording');
            ui.btn.classList.remove('connect-mode');
            ui.targetInp.disabled = true;
            if (state.target > 0) {
                ui.pBar.style.display = 'block';
                ui.pFill.style.width = '0%';
            }
            updateBtnState();
        }

        function stopSession(auto = false) {
            state.recording = false;
            
            // Guardar Log
            if (state.dose > 0.1) {
                const log = {
                    date: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
                    val: state.dose.toFixed(1),
                    auto: auto
                };
                state.history.unshift(log);
                if(state.history.length > 10) state.history.pop();
                localStorage.setItem('uvpro_logs', JSON.stringify(state.history));
                renderHistory();
            }

            // Feedback
            if (auto) navigator.vibrate?.([100,50,100,50,500]);

            // UI Reset
            ui.btn.classList.remove('recording');
            ui.targetInp.disabled = false;
            ui.pBar.style.display = 'none';
            updateBtnState();
        }

        function updateBtnState() {
            // Ocultar todos
            ui.icons.ble.style.display = 'none';
            ui.icons.play.style.display = 'none';
            ui.icons.stop.style.display = 'none';

            if (!state.connected) {
                ui.icons.ble.style.display = 'block';
                ui.btn.style.background = 'var(--prim)';
            } else if (state.recording) {
                ui.icons.stop.style.display = 'block';
            } else {
                ui.icons.play.style.display = 'block';
                ui.btn.style.background = 'var(--prim)';
            }
        }

        // --- HISTORIAL ---
        function renderHistory() {
            ui.hist.innerHTML = state.history.map(item => `
                <div class="h-item">
                    <span style="color:#888">${item.date}</span>
                    <div>
                        <b>${item.val}</b> mJ
                        ${item.auto ? '<span class="h-tag">META</span>' : ''}
                    </div>
                </div>
            `).join('');
        }
        
        function clearHist() {
            if(confirm("¿Borrar historial?")) {
                state.history = [];
                localStorage.setItem('uvpro_logs', '[]');
                renderHistory();
            }
        }

        // Init
        renderHistory();

    </script>
</body>
</html>
