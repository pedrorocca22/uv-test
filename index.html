<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UV Pro Test V2</title>
    <style>
        :root { --bg: #000; --txt: #0f0; --btn: #333; }
        body { font-family: monospace; background: var(--bg); color: var(--txt); padding: 20px; }
        button { background: var(--btn); color: #fff; padding: 15px; width: 100%; border: 1px solid #fff; margin-bottom: 10px; font-weight:bold;}
        #log { border: 1px solid #555; height: 300px; overflow-y: scroll; padding: 10px; font-size: 0.8rem;}
    </style>
</head>
<body>
    <h2>DIAGNÓSTICO V2</h2>
    <h1 id="val">--</h1>
    
    <button onclick="conectar()">1. CONECTAR</button>
    <button onclick="leerManual()" id="btnRead" disabled>2. FORZAR LECTURA (Manual)</button>

    <div id="log">Logs aparecerán aquí...<br></div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let miCaracteristica;

        function log(msg) {
            const d = document.getElementById('log');
            d.innerHTML = `> ${msg}<br>` + d.innerHTML;
        }

        async function conectar() {
            try {
                log("Buscando...");
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                
                log("Conectando GATT...");
                const server = await device.gatt.connect();
                
                log("Obteniendo Servicio...");
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                log("Obteniendo Característica...");
                miCaracteristica = await service.getCharacteristic(CHAR_UUID);

                // Intento de suscripción automática
                log("Suscribiendo...");
                await miCaracteristica.startNotifications();
                miCaracteristica.addEventListener('characteristicvaluechanged', mostrarDato);
                
                document.getElementById('btnRead').disabled = false;
                log("¡CONECTADO! Esperando datos...");

            } catch (e) { log("ERROR: " + e); }
        }

        async function leerManual() {
            if (!miCaracteristica) return log("No conectado");
            try {
                log("Leyendo manualmente...");
                const valor = await miCaracteristica.readValue(); // Petición manual
                mostrarDato({ target: { value: valor } });
            } catch (e) { log("Error lectura: " + e); }
        }

        function mostrarDato(event) {
            const dec = new TextDecoder();
            const txt = dec.decode(event.target.value);
            log("RX: " + txt);
            document.getElementById('val').innerText = txt.split('|')[0];
        }
    </script>
</body>
</html>
