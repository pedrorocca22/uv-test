<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0c">
    <title>UV Pro 365 (Fixed)</title>
    <style>
        :root { 
            --bg: #0a0a0c; --card: #1c1c1f; --prim: #6200ea; 
            --acc: #00e676; --err: #ff1744; --txt: #ffffff; --sec: #b0b0b0;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            background: var(--bg); color: var(--txt); margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; -webkit-tap-highlight-color: transparent; user-select: none;
        }

        /* HEADER */
        header {
            width: 100%; padding: 15px 20px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10,10,12,0.9); position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .brand { font-weight: 800; font-size: 1.2rem; }
        .status-badge { 
            font-size: 0.7rem; font-weight: bold; padding: 4px 10px; border-radius: 20px; 
            background: #222; color: #666; transition: 0.3s;
        }
        .status-badge.on { background: rgba(0, 230, 118, 0.2); color: var(--acc); }

        /* MAIN UI */
        .container { width: 90%; max-width: 400px; padding-bottom: 100px; }
        .hero-card {
            margin-top: 20px; background: var(--card); border-radius: 30px;
            padding: 40px 20px; text-align: center; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative;
        }
        .val-big { font-size: 4.5rem; font-weight: 800; margin: 5px 0; line-height: 1; letter-spacing: -2px; }
        .unit { font-size: 1rem; color: var(--sec); font-weight: 500; text-transform: uppercase; }
        
        /* DEBUG LINE (NUEVO) */
        .debug-text { font-family: monospace; font-size: 0.7rem; color: #555; margin-top: 10px; min-height: 15px;}

        /* STATS */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-item { background: var(--card); padding: 20px; border-radius: 20px; text-align: center; }
        .val-med { font-size: 1.8rem; font-weight: 700; }
        .lbl-sm { font-size: 0.75rem; color: var(--sec); text-transform: uppercase; display: block; margin-bottom: 5px;}

        /* FAB BUTTON */
        .fab-container { position: fixed; bottom: 30px; right: 30px; z-index: 200; }
        .btn-fab {
            width: 70px; height: 70px; border-radius: 50%; border: none;
            background: var(--prim); color: white; box-shadow: 0 10px 25px rgba(98, 0, 234, 0.4);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .btn-fab.connected { background: #333; }
        .btn-fab svg { width: 32px; height: 32px; fill: currentColor; }
    </style>
</head>
<body>

    <header>
        <div class="brand">UV Pro 365</div>
        <div id="statusBadge" class="status-badge">DESCONECTADO</div>
    </header>

    <div class="container">
        <div class="hero-card">
            <span class="lbl-sm" style="margin-bottom:10px">Irradiancia Instantánea</span>
            <div id="irr" class="val-big">0.00</div>
            <div class="unit">mW / cm²</div>
            <div id="debug" class="debug-text">Esperando datos...</div>
        </div>

        <div class="grid">
            <div class="stat-item">
                <span class="lbl-sm">Dosis</span>
                <div id="dose" class="val-med" style="color:var(--acc)">0.00</div>
            </div>
            <div class="stat-item">
                <span class="lbl-sm">Temp</span>
                <div id="temp" class="val-med">--°</div>
            </div>
        </div>
    </div>

    <div class="fab-container">
        <button id="mainBtn" class="btn-fab" onclick="connect()">
            <svg id="iconBle" viewBox="0 0 24 24"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg>
        </button>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let state = { dose: 0, lastT: 0 };
        const ui = {
            irr: document.getElementById('irr'),
            dose: document.getElementById('dose'),
            temp: document.getElementById('temp'),
            debug: document.getElementById('debug'),
            badge: document.getElementById('statusBadge'),
            btn: document.getElementById('mainBtn')
        };

        async function connect() {
            try {
                ui.debug.innerText = "Buscando...";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const char = await service.getCharacteristic(CHAR_UUID);

                await char.startNotifications();
                char.addEventListener('characteristicvaluechanged', handleData);

                ui.badge.innerText = "CONECTADO";
                ui.badge.classList.add('on');
                ui.btn.classList.add('connected');
                state.lastT = Date.now();
                ui.debug.innerText = "Conectado. Esperando paquetes...";

                device.addEventListener('gattserverdisconnected', () => {
                    location.reload();
                });

            } catch (e) {
                alert("Error: " + e);
                ui.debug.innerText = "Error: " + e;
            }
        }

        function handleData(event) {
            try {
                const dec = new TextDecoder();
                const raw = dec.decode(event.target.value);
                
                // 1. MOSTRAR DATO CRUDO (Para saber si llega)
                ui.debug.innerText = "RX: " + raw;

                // 2. LIMPIEZA AGRESIVA (Quitar espacios, nulos, saltos)
                const cleanRaw = raw.replace(/[^\d.|-]/g, ''); 
                
                const parts = raw.split('|');
                
                // Parsear con seguridad
                let irr = parseFloat(parts[0]);
                let temp = parts.length > 1 ? parseFloat(parts[1]) : 0;

                // Si no es un número válido, ignorar este paquete
                if (isNaN(irr)) return;

                ui.irr.innerText = irr.toFixed(2);
                ui.temp.innerText = temp.toFixed(1) + "°";

                // Cálculo Dosis
                if (irr > 0.01) {
                    const now = Date.now();
                    const dt = (now - state.lastT) / 1000;
                    state.dose += irr * dt;
                    ui.dose.innerText = state.dose.toFixed(1);
                    state.lastT = now;
                } else {
                    state.lastT = Date.now();
                }

            } catch (err) {
                console.error(err);
                ui.debug.innerText = "Error Parse: " + err;
            }
        }
    </script>
</body>
</html>
